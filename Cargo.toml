[package]
name = "xemanh"
version = "0.1.0"
edition = "2024"
description = "Lightweight image viewer"
authors = ["hoangphuctv"]
readme = "README.md"
keywords = ["image", "viewer", "photo"]
categories = ["multimedia"]

[dependencies]
macroquad = "0.4.16"
image = { version = "0.24", default-features = false, features = ["jpeg", "png", "bmp", "gif"] }
kamadak-exif = "0.6"
